<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميزانيتي - تواصل معنا</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/menu.js" defer></script>
</head>

<body>

<header>

    <div class="header-inner">
        <h1>ميزانيتي</h1>
    </div>

    <button class="menu-toggle" type="button" aria-label="فتح القائمة"
            aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
    </button>

</header>

<nav id="main-nav">
        <a href="home.html">الرئيسية</a>
        <a href="transactions.html">المعاملات والميزانية</a>
        <a href="goals.html">الأهداف والتقارير</a>
        <a href="contact.html" class="active">تواصل معنا</a>
        <a href="../index.html">تسجيل الخروج</a>
</nav>

<main>

    <section>

        <h2>تواصل معنا</h2>

        <p>
            يمكنك إرسال استفسارك أو اقتراحك من خلال النموذج التالي.
        </p>

        <form>

            <label for="name">الاسم:</label><br>
            <input type="text"
                   id="name"
                   name="name"
                   required>

            <br><br>

            <label for="email">البريد الإلكتروني:</label><br>
            <input type="email"
                   id="email"
                   name="email"
                   required>

            <br><br>

            <label for="subject">موضوع الرسالة:</label><br>

            <select id="subject" name="subject">
                <option>استفسار عام</option>
                <option>مشكلة في الحساب</option>
                <option>مشكلة في المعاملات</option>
                <option>اقتراح لتطوير الموقع</option>
                <option>أخرى</option>
            </select>

            <br><br>

            <label for="message">الرسالة:</label><br>

            <textarea id="message"
                      name="message"
                      rows="6"
                      cols="40"
                      required></textarea>

            <br><br>

            <button type="submit">إرسال الرسالة</button>

        </form>

    </section>

    <hr>

    <section>

        <h2>معلومات التواصل</h2>

        <p>
            البريد الإلكتروني:
            info@mizanaty.com
        </p>

    </section>

</main>

<footer>
    <p>جميع الحقوق محفوظة © 2026 ميزانيتي</p>
</footer>

</body>
</html>
