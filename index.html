<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميزانيتي - إنشاء حساب</title>
</head>

<body>

    <header>
        <h1>ميزانيتي</h1>
        <p>نظام إدارة الميزانية والمصروفات الشخصية</p>
    </header>

    <main>

        <h2>إنشاء حساب جديد</h2>

        <form action="login.html">

            <label for="fullname">الاسم الكامل:</label><br>
            <input type="text" id="fullname" name="fullname" required>

            <br><br>

            <label for="email">البريد الإلكتروني:</label><br>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="phone">رقم الهاتف:</label><br>
            <input type="tel" id="phone" name="phone">

            <br><br>

            <label for="password">كلمة المرور:</label><br>
            <input type="password" id="password" name="password" required>

            <br><br>

            <label for="confirmPassword">تأكيد كلمة المرور:</label><br>
            <input type="password" id="confirmPassword"
                   name="confirmPassword" required>

            <br><br>

            <label for="currency">العملة:</label><br>
            <select id="currency" name="currency">
                <option value="SDG">الجنيه السوداني</option>
                <option value="USD">الدولار الأمريكي</option>
                <option value="SAR">الريال السعودي</option>
                <option value="EUR">اليورو</option>
            </select>

            <br><br>

            <input type="checkbox" id="terms" required>
            <label for="terms">أوافق على شروط استخدام الموقع</label>

            <br><br>

            <button type="submit">إنشاء الحساب</button>

        </form>

        <p>
            لديك حساب بالفعل؟
            <a href="login.html">تسجيل الدخول</a>
        </p>

    </main>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 ميزانيتي</p>
    </footer>

</body>
</html>
